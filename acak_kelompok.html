<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acak Kelompok Belajar</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        margin: 0;
        padding: 0;
    }
    .container {
        max-width: 600px;
        margin: 50px auto;
        background-color: #fff;
        border-radius: 8px;
        padding: 20px;
        box-shadow: 0px 0px 10px 0px rgba(0,0,0,0.1);
    }
    h1 {
        text-align: center;
        color: #333;
    }
    label {
        font-weight: bold;
        display: block;
        margin-bottom: 5px;
    }
    input[type="number"],
    textarea {
        width: 100%;
        padding: 8px;
        margin-bottom: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
        font-family: inherit;
        font-size: 14px;
    }
    small {
        display: block;
        margin-top: -8px;
        margin-bottom: 12px;
        color: #777;
    }
    button {
        width: 100%;
        padding: 10px;
        font-size: 16px;
        cursor: pointer;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 4px;
    }
    button:hover {
        background-color: #45a049;
    }
    #kelompok {
        margin-top: 20px;
    }
    #kelompok h3 {
        margin-bottom: 4px;
        color: #333;
        border-bottom: 2px solid #4CAF50;
        padding-bottom: 4px;
    }
    #kelompok ul {
        margin-top: 6px;
        padding-left: 20px;
    }
    #kelompok li {
        padding: 2px 0;
    }
    #errorMsg {
        color: #c0392b;
        font-weight: bold;
        margin-bottom: 10px;
        display: none;
    }
</style>
</head>
<body>
<div class="container">
    <h1>Acak Kelompok Belajar</h1>

    <div>
        <label for="namaSiswa">Nama Siswa:</label>
        <textarea id="namaSiswa" rows="8" placeholder="Masukkan nama siswa (satu nama per baris)"></textarea>
        <small>Jumlah siswa akan dihitung otomatis dari daftar nama di atas.</small>
    </div>

    <div>
        <label for="jumlahKelompok">Jumlah Kelompok:</label>
        <input type="number" id="jumlahKelompok" placeholder="Masukkan jumlah kelompok" min="1">
    </div>

    <div id="errorMsg"></div>

    <button onclick="acakKelompok()">Acak Kelompok</button>
    <div id="kelompok"></div>
</div>

<script>
function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

function showError(msg) {
    var errBox = document.getElementById("errorMsg");
    errBox.textContent = msg;
    errBox.style.display = "block";
}

function clearError() {
    var errBox = document.getElementById("errorMsg");
    errBox.textContent = "";
    errBox.style.display = "none";
}

function escapeHTML(str) {
    var div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
}

function acakKelompok() {
    clearError();
    document.getElementById("kelompok").innerHTML = "";

    // Ambil nama, buang baris kosong & spasi berlebih
    var namaSiswa = document.getElementById("namaSiswa").value
        .split("\n")
        .map(function (n) { return n.trim(); })
        .filter(function (n) { return n.length > 0; });

    var jumlahKelompok = parseInt(document.getElementById("jumlahKelompok").value, 10);

    if (namaSiswa.length === 0) {
        showError("Masukkan minimal satu nama siswa.");
        return;
    }

    if (isNaN(jumlahKelompok) || jumlahKelompok <= 0) {
        showError("Masukkan jumlah kelompok dengan benar (angka lebih dari 0).");
        return;
    }

    if (jumlahKelompok > namaSiswa.length) {
        showError("Jumlah kelompok tidak boleh lebih banyak dari jumlah siswa (" + namaSiswa.length + " siswa).");
        return;
    }

    shuffleArray(namaSiswa);

    var kelompok = [];
    for (var i = 0; i < jumlahKelompok; i++) {
        kelompok.push([]);
    }

    for (var i = 0; i < namaSiswa.length; i++) {
        kelompok[i % jumlahKelompok].push(namaSiswa[i]);
    }

    var kelompokHTML = "<p><strong>Total siswa:</strong> " + namaSiswa.length + " orang</p>";
    for (var i = 0; i < jumlahKelompok; i++) {
        kelompokHTML += "<h3>Kelompok " + (i + 1) + " (" + kelompok[i].length + " orang):</h3>";
        kelompokHTML += "<ul>";
        for (var j = 0; j < kelompok[i].length; j++) {
            kelompokHTML += "<li>" + escapeHTML(kelompok[i][j]) + "</li>";
        }
        kelompokHTML += "</ul>";
    }

    document.getElementById("kelompok").innerHTML = kelompokHTML;
}
</script>
</body>
</html>
